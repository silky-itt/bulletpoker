<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Texas Hold'em where you bet bullets. A 3D bluffing game in the browser.">
<meta name="theme-color" content="#0d0a08">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Bullet Poker">
<meta property="og:title" content="Bullet Poker">
<meta property="og:description" content="Texas Hold'em where you bet bullets. Six chambers. Last one standing wins. Play online with 2–4 friends.">
<meta property="og:url" content="https://silky-itt.github.io/bulletpoker/">
<meta property="og:image" content="https://silky-itt.github.io/bulletpoker/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://silky-itt.github.io/bulletpoker/assets/og-image.png">
<title>Bullet Poker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Playfair+Display:ital,wght@0,700;0,900;1,900&family=Be+Vietnam+Pro:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: full-screen 3D bar; HUD floats over it — status top, big moments center, hand + actions bottom. Single dark theme by choice (see DESIGN.md §3). */
:root{
  --bg:#0d0a08; --wood:#231811; --wood-a:rgba(28,19,13,.88); --line:#4a3726;
  --paper:#f1e8d4; --ink:#1d1611; --red:#b8322a; --fg:#eadcc2; --muted:#a58f72;
  --lamp:#e2a64a; --blood:#c8412f; --ok:#8cbc72;
  --f-display:'Playfair Display', Georgia, serif;
  --f-body:'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
  --f-slab:'Alfa Slab One', 'Rockwell', Georgia, serif;
  --gold:#e8c24a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);overflow:hidden}
#view{position:fixed;inset:0;width:100%;height:100%;display:block}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.label3d{position:absolute;left:0;top:0;display:grid;justify-items:center;gap:2px;background:var(--wood-a);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;white-space:nowrap}
.label3d b{font-weight:700}
.label3d .d{font:700 10px/16px var(--f-mono);width:16px;height:16px;border-radius:50%;background:var(--paper);color:var(--ink);text-align:center;font-style:normal;position:absolute;top:-8px;right:-8px}
.label3d .bul{font-size:11px;letter-spacing:2px;color:var(--lamp)}
.label3d .bul .emp{color:var(--muted);opacity:.6}
.label3d .st{font-size:11px;color:var(--muted)}
.label3d.turn{border-color:var(--lamp);box-shadow:0 0 18px -4px var(--lamp)}
.label3d.turn .st{color:var(--lamp)}
.label3d.won{border-color:var(--ok)}
.label3d.dead{opacity:.5}

.hud{position:fixed;left:0;right:0;padding-inline:16px;pointer-events:none;display:flex;gap:10px;flex-wrap:wrap}
.hud > *{pointer-events:auto}
.hud.top{top:0;padding-top:calc(env(safe-area-inset-top,0px) + 12px);justify-content:space-between;align-items:flex-start}
.hud.bottom{bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);justify-content:center;align-items:flex-end}
.chip{background:var(--wood-a);border:1px solid var(--line);border-radius:10px;padding:8px 12px;backdrop-filter:blur(4px)}
.brand{font-family:var(--f-display);font-style:italic;font-weight:900;color:var(--lamp);font-size:20px;line-height:1}
.label{font:500 11px/1.3 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--f-display);font-size:20px;font-weight:700}
button{font:inherit;cursor:pointer;border:0}
button:focus-visible,input:focus-visible,select:focus-visible,.thumb:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.btn{background:var(--lamp);color:var(--ink);font-weight:700;padding:11px 16px;border-radius:7px}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn.ghost{background:var(--wood-a);color:var(--fg);border:1px solid var(--line)}
.btn.ghost.on{border-color:var(--lamp);color:var(--lamp)}
.btn.small{padding:8px 12px;font-size:13px}
.btn.fold{background:#3a2a20;color:var(--fg)}
.btn.red{background:var(--blood);color:#fff4ec}
kbd{font:500 10px var(--f-mono);opacity:.6;margin-left:6px;border:1px solid currentColor;border-radius:3px;padding:0 3px}
.controls{display:grid;gap:10px;justify-items:center;width:100%;max-width:780px}
.controls > *{max-width:100%}
.mine{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.bullets{font-size:15px;letter-spacing:3px;color:var(--lamp)}
.bullets .emp{color:var(--muted);opacity:.55}
.risk{font:500 12px var(--f-mono);color:var(--muted);text-align:center}
.risk b{color:var(--fg)}
.log{width:min(360px,100%);max-height:150px;overflow:auto;font-size:12.5px;color:var(--muted);display:grid;gap:2px}
.log div:first-child{color:var(--fg)}
.boardstrip{display:grid;gap:8px;justify-items:center}

.card2d{width:56px;height:80px;border-radius:7px;background:var(--paper);color:var(--ink);position:relative;flex:none;font-family:var(--f-display);font-weight:900;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.card2d.red{color:var(--red)}
.card2d .r{position:absolute;top:5px;left:7px;font-size:19px;line-height:1}
.card2d .s{position:absolute;right:6px;bottom:4px;font-size:30px;line-height:1}
.card2d.empty{background:transparent;border:1.5px dashed var(--line);box-shadow:none}
.card2d.pick{cursor:pointer}
.card2d.mini{width:40px;height:56px}.card2d.mini .r{font-size:15px;top:4px;left:5px}.card2d.mini .s{font-size:20px}
.card2d.sel{box-shadow:0 0 0 3px var(--lamp);transform:translateY(-6px)}

.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:16px;z-index:10;overflow:auto}
.overlay.dim{background:rgba(10,7,5,.8)}
.overlay.solid{background:var(--bg)}
.panel{background:var(--wood);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:16px;width:min(760px,100%)}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:clamp(32px,6vw,52px);font-style:italic;font-weight:900;color:var(--lamp)}
h2{font-size:21px}
h3{font-size:17px}
.sub{color:var(--muted);margin:0}
.seat{display:grid;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px}
.seat.off{opacity:.45}
.seat-head{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.seat-head input[type=text],.seat-head select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px 9px;font:inherit;min-width:0;width:100%}
.seat-head select{width:auto}
.rules{display:grid;gap:5px;margin:0;padding-left:20px;font-size:14px}
.rules b{color:var(--lamp)}
details summary{cursor:pointer;font-weight:700}
.shot{font-family:var(--f-display);font-weight:900;font-style:italic;font-size:clamp(44px,11vw,96px);line-height:1;text-shadow:0 4px 30px rgba(0,0,0,.8);text-align:center}
.shot.dead{color:var(--blood);text-shadow:0 0 30px rgba(200,65,47,.7),0 4px 30px rgba(0,0,0,.9);animation:bangIn .55s cubic-bezier(.2,1.7,.35,1) both}
@keyframes bangIn{0%{transform:scale(2.4) rotate(-9deg);opacity:0;filter:blur(6px)}25%{opacity:1;filter:none}100%{transform:scale(1) rotate(-4deg)}}
.shot.live{animation:clickIn .35s cubic-bezier(.2,1.6,.4,1) both}
@keyframes clickIn{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.shot.live{color:var(--ok)}.shot.aim{color:var(--fg);font-size:clamp(20px,4vw,30px)}
.results{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 76px);display:grid;justify-items:center;gap:0;pointer-events:none;z-index:3;animation:resIn .45s ease-out both}
@keyframes resIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.rboard{position:relative;display:flex;gap:10px;padding:14px 22px;border:2px solid var(--gold);background:rgba(18,12,8,.82);margin-bottom:18px}
.rboard .gem{position:absolute;left:50%;width:14px;height:14px;background:var(--gold);transform:translateX(-50%) rotate(45deg)}
.rboard .gem.t{top:-8px}.rboard .gem.b{bottom:-8px}
.rrow{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.25fr);align-items:center;gap:22px;padding:10px 16px;background:rgba(18,12,8,.66);border-top:2px solid var(--gold);margin-top:-2px}
.rrow:last-child{border-bottom:2px solid var(--gold)}
.rrow.win{background:linear-gradient(90deg,rgba(18,12,8,.66),rgba(120,92,24,.55),rgba(18,12,8,.66))}
.rname{font:700 clamp(16px,2.4vw,26px)/1.1 var(--f-body);text-align:right;color:var(--paper);text-shadow:0 2px 6px #000;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcards{display:flex;gap:10px}
.rhand{font-family:var(--f-slab);font-size:clamp(18px,2.8vw,32px);line-height:1;color:var(--paper);text-transform:uppercase;text-shadow:0 2px 0 #3a2a10,0 3px 10px #000;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.rhand .ord{color:var(--gold);font-size:1.15em}
.rhand .ord sup{font-size:.5em;vertical-align:baseline;position:relative;top:-.05em}
.rtag{font:700 12px/1 var(--f-mono);letter-spacing:.12em;padding:5px 8px;border-radius:4px;text-shadow:none;font-family:var(--f-mono)}
.rtag.safe{background:var(--ok);color:var(--ink)}
.rtag.shoot{background:var(--blood);color:#fff4ec}
.card2d.res{width:58px;height:82px}.card2d.res .r{font-size:24px;top:6px;left:0;right:0;text-align:center}.card2d.res .s{font-size:30px;left:0;right:0;bottom:8px;text-align:center}
.cylwrap{display:grid;justify-items:center;gap:10px}
.cylsvg{width:clamp(110px,16vw,150px);height:auto;filter:drop-shadow(0 6px 20px rgba(0,0,0,.7))}
.cylsvg.spin{animation:spin 1.6s cubic-bezier(.15,.6,.25,1) both}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(1440deg)}}
.cylsvg .ch{fill:#0b0b0b;stroke:#555;stroke-width:2}
.cylsvg .ch.full{fill:#c8963c;stroke:#e8c27a}
.cylsvg .ch.pop{animation:pop .3s ease-out}
@keyframes pop{from{transform:scale(1.6)}to{transform:scale(1)}}
.cylsvg .pr{fill:#b0603a}
.cylsvg .ch.spent{fill:#2a2a2a;stroke:#3a3a3a}
.cylsvg .cur{fill:none;stroke:var(--lamp);stroke-width:2.5}
@media (max-width:620px){ .rrow{grid-template-columns:auto minmax(0,1fr);gap:4px 12px}.rname{grid-column:1/-1;text-align:left;font-size:15px}.card2d.res{width:42px;height:60px}.card2d.res .r{font-size:17px}.card2d.res .s{font-size:21px}.rboard{gap:6px;padding:10px 12px}.rhand{font-size:18px} }
.goldflash{position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,rgba(255,226,140,.85),rgba(255,226,140,0) 60%);opacity:0;pointer-events:none;z-index:9}
.goldflash.on{animation:gf 2.6s ease-out}
@keyframes gf{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
.godsave{display:grid;justify-items:center;gap:6px;text-align:center}
.shot.god{color:#ffe08a;text-shadow:0 0 24px rgba(255,214,110,.9),0 4px 30px rgba(0,0,0,.8);animation:godIn .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes godIn{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.field{display:grid;gap:6px}
.field input,.invite{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:10px 11px;font:inherit;min-width:0;width:100%}
.invite{flex:1 1 260px;width:auto;font:500 13px var(--f-mono);color:var(--muted)}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.box{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;align-content:start;min-width:0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.rooms{display:grid;gap:6px;max-height:240px;overflow:auto}
.roomrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 10px;background:var(--bg);border-radius:8px}
.rinfo{display:grid;min-width:0}.rinfo b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rinfo span{font-size:12px;color:var(--muted)}
.pill{font:500 12px var(--f-mono);padding:3px 8px;border-radius:20px;border:1px solid var(--ok);color:var(--ok)}
.pill.busy{border-color:var(--muted);color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:10px 0}
.avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--lamp)}
.codebox{display:grid;justify-items:end}.codebox b{font:700 clamp(26px,5vw,38px)/1 var(--f-mono);letter-spacing:.18em;color:var(--lamp)}
.seats4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.seatcard{border:1.5px solid var(--line);border-radius:10px;overflow:hidden;display:grid;justify-items:center;text-align:center;padding-bottom:8px;gap:2px;background:var(--bg)}
.seatcard img,.seatcard .ph{width:100%;aspect-ratio:22/25;object-fit:cover;display:grid;place-items:center;font-family:var(--f-display);font-size:30px;color:var(--muted);background:#1a120c}
.seatcard b{font-size:14px;padding-inline:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.seatcard span{font-size:11px;color:var(--muted)}
.seatcard.me{border-color:var(--lamp)}
.seatcard.empty{opacity:.5;border-style:dashed}
@media (max-width:620px){ .seats4{grid-template-columns:repeat(2,minmax(0,1fr))} }
/* gun moment: the edges close in and pulse with the heartbeat (audio.js beats every 700 ms) */
.vignette{position:fixed;inset:0;pointer-events:none;z-index:8;opacity:0;transition:opacity .8s ease;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 38%,rgba(8,4,2,.55) 70%,rgba(4,2,1,.92) 100%)}
.vignette.on{opacity:1;animation:hb .7s ease-out infinite}
.vignette.self{background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 28%,rgba(30,4,2,.6) 62%,rgba(10,1,0,.95) 100%)}
@keyframes hb{0%{transform:scale(1)}12%{transform:scale(.965)}30%{transform:scale(1)}44%{transform:scale(.98)}62%{transform:scale(1)}}
/* volume panel: lives outside #hud so re-rendering the HUD doesn't interrupt a drag */
.volpanel{position:fixed;top:58px;right:12px;z-index:30;display:grid;gap:12px;width:min(260px,calc(100vw - 32px));padding:14px 16px;background:var(--wood);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.volpanel[hidden]{display:none}
.volpanel label{display:grid;grid-template-columns:62px minmax(0,1fr) 34px;align-items:center;gap:10px;font-size:13px}
.volpanel output{font:500 12px var(--f-mono);color:var(--muted);text-align:right}
.volpanel input[type=range]{width:100%;accent-color:var(--lamp);min-height:28px}
/* full-screen character select: a live 3D stage with the info and choices over it */
.csel{position:fixed;inset:0;z-index:40;background:#0e0a07;overflow:hidden}
.csel[hidden]{display:none}
.csel canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
.csel .shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(14,10,7,0) 38%,rgba(14,10,7,.82) 62%,rgba(14,10,7,.95)),linear-gradient(0deg,rgba(14,10,7,.92),rgba(14,10,7,0) 24%)}
.cui{position:absolute;inset:0;pointer-events:none}
.cui>*{pointer-events:auto}
.cui .top{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;pointer-events:none}
.cui .top>*{pointer-events:auto}
.cui .brand{font:italic 900 clamp(22px,3vw,34px)/1 var(--f-display);color:var(--lamp)}
.cui .info{position:absolute;right:clamp(16px,6vw,90px);top:50%;transform:translateY(-56%);width:min(440px,38vw);display:grid;gap:14px}
.cui .idx{font:500 12px var(--f-mono);letter-spacing:.22em;color:var(--muted)}
.cui .cname{font:italic 900 clamp(52px,7.5vw,104px)/.92 var(--f-display);color:var(--paper);text-shadow:0 6px 30px rgba(0,0,0,.6);animation:cIn .35s cubic-bezier(.2,1.4,.4,1) both}
@keyframes cIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.cui .species{font:700 13px var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--lamp);margin-top:8px}
.cui .blurb{margin:0;font-size:17px;line-height:1.45;max-width:34ch}
.cui .note{margin:0;font-size:14px;color:var(--blood)}
.cui .actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cui .info.home{width:min(540px,44vw);max-height:calc(100vh - 150px);overflow-y:auto;transform:translateY(-50%);padding:4px 6px 4px 2px;gap:12px;scrollbar-width:thin}
.cui .lob{display:grid;gap:14px;background:rgba(26,18,12,.8);border:1px solid var(--line);border-radius:12px;padding:14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.cui .lob section{display:grid;gap:10px;align-content:start;min-width:0}
.cui .lob h3{margin:0;font-size:17px}
.cui .lob .rooms{max-height:150px}
.cui .cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cui .linkbtn{justify-self:start;background:none;border:0;padding:4px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:14px}
.cui .linkbtn:hover{color:var(--lamp)}
.cui .crules{max-height:46vh;overflow:auto;background:rgba(14,10,7,.85);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.cui .arrow{position:absolute;top:44%;width:54px;height:54px;border-radius:50%;background:rgba(26,18,12,.72);border:1px solid var(--line);color:var(--fg);font:400 30px/1 var(--f-display);display:grid;place-items:center;padding:0 0 4px}
.cui .arrow:hover{border-color:var(--lamp);color:var(--lamp)}
.cui .arrow.prev{left:clamp(12px,3vw,40px)}.cui .arrow.next{left:calc(58vw - 80px)}
.cui .strip{position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:8px;padding:4px 16px;overflow-x:auto}
.cui .thumb{flex:0 0 auto;width:66px;height:74px;border-radius:10px;border:1.5px solid var(--line);background:#1a120c;overflow:hidden;padding:0;opacity:.7;position:relative;transition:opacity .15s,transform .15s}
.cui .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.cui .thumb:hover{opacity:1;transform:translateY(-2px)}
.cui .thumb.sel{border-color:var(--lamp);box-shadow:0 0 0 2px var(--lamp);opacity:1}
.cui .thumb.taken{opacity:.28}
.cui .thumb.taken::after{content:'✕';position:absolute;inset:0;display:grid;place-items:center;font-size:24px;color:var(--fg)}
@media (max-width:760px), (max-aspect-ratio:4/5){
  .csel .shade{background:linear-gradient(0deg,rgba(14,10,7,.97) 40%,rgba(14,10,7,.6) 55%,rgba(14,10,7,0) 68%)}
  .cui .info{left:16px;right:16px;width:auto;top:auto;bottom:104px;transform:none;gap:10px}
  .cui .info.home{width:auto;transform:none;top:34vh;bottom:96px;max-height:none;padding:4px 2px}
  .csel.home .cui .arrow{top:calc(17vh - 23px)}
  .csel.home .shade{background:linear-gradient(0deg,rgba(14,10,7,.97) 62%,rgba(14,10,7,.5) 68%,rgba(14,10,7,0) 74%)}
  .cui .cols2{grid-template-columns:1fr}
  .cui .cname{font-size:clamp(42px,12vw,64px)}
  .cui .blurb{font-size:15px}
  .cui .arrow{top:28%;width:46px;height:46px}.cui .arrow.next{left:auto;right:12px}
  .cui .thumb{width:52px;height:58px}
  .cui .strip{justify-content:flex-start}
}

<script>
(() => {
const E = window.PokerEngine, CH = PokerScene.CHARACTERS, NET = window.PokerNet;
const $hud = document.getElementById('hud'), $ov = document.getElementById('ov');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STREET_NAME = PokerGame.STREET_NAME;

/* ---------- profile ---------- */
let profile = {name: '', animal: 'bull'};
try { const p = JSON.parse(localStorage.getItem('bp-profile')); if (p && CH[p.animal]) profile = p; } catch {}
const saveProfile = () => { try { localStorage.setItem('bp-profile', JSON.stringify(profile)); } catch {} };
let roomPrefs = {name: '', isPublic: true, mode: 'poker'};
try { const m = localStorage.getItem('bp-mode'); if (NET.MODES.includes(m)) roomPrefs.mode = m; } catch {}

let scene3d = null;
try { scene3d = PokerScene.createScene(document.getElementById('view'), document.getElementById('labels')); } catch (e) { console.error(e); }
if (scene3d) scene3d.onFlicker = () => audio.play('buzz');
let portraits = {};
try { portraits = PokerScene.renderPortraits(); } catch (e) { console.error(e); }
const audio = PokerAudio.createAudio();
PokerAudio.bindUnlock(audio);

/* ---------- session ----------
   mode 'host': this browser runs PokerGame and relays to guests.
   mode 'guest': this browser renders the state the host sends. */
let session = null;        // {mode, net, game?, S?, seat, room, gameId}
let lobbyStop = null, lobbyRooms = [], lobbyStatus = 'connecting', joinCode = '', notice = '';
let viewer = null, sw = null, logOpen = false, boardOpen = false;

const card2d = (c, cls = '', attrs = '') => {
  if (!c || c.hidden) return `<div class="card2d empty ${cls}"></div>`;
  const red = c.s === 1 || c.s === 2;
  return `<div class="card2d ${red ? 'red' : ''} ${cls}" ${attrs} aria-label="${E.rankLabel(c.r)}${E.SUITS[c.s]}"><span class="r">${E.rankLabel(c.r)}</span><span class="s">${E.SUITS[c.s]}</span></div>`;
};
const bulletsHTML = n => `<span class="bullets" aria-label="${n} of 6 bullets">${'●'.repeat(n)}<span class="emp">${'○'.repeat(Math.max(0, 6 - n))}</span></span>`;
const onClick = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = () => { audio.unlock(); audio.play('ui'); fn(); }; };
const inviteLink = code => location.origin + location.pathname + '#' + code;

/* ---------- screen 1: profile (name + character) ---------- */
// The profile screen is now part of the home screen (character select + lobby).
function renderProfile(){ showLobby(); }

/* ---------- full-screen character select (profile, and "Change character" in a room) ---------- */
// A live 3D stage (PokerScene.createShowcase) with the name, blurb and choices over it.
// ←/→, swipe, the arrows or the strip change character; Enter confirms; Escape backs out (room).
const KEYS = Object.keys(CH);
const $csel = document.getElementById('csel'), $cui = document.getElementById('cselUI');
let csel = null, showcase = null, rulesMode = 'poker';
const narrowSelect = () => matchMedia('(max-width:760px), (max-aspect-ratio:4/5)').matches;
function layoutShowcase(){
  if (!showcase) return;
  const home = csel && csel.mode === 'home';
  if (!narrowSelect()) showcase.setOffset(-0.2, 0);
  else if (home) showcase.setOffset(0, -0.33, 0.5); // phone home: a small figure in the top third, the lobby below
  else showcase.setOffset(0, -0.13);
}
function openSelect(o){
  csel = Object.assign({taken: new Set()}, o); csel.index = Math.max(0, KEYS.indexOf(o.current));
  const home = csel.mode === 'home'; // home = character + name + lobby; 'room' = change character at a table
  $csel.hidden = false; $csel.classList.toggle('home', home);
  if (!showcase) { try { showcase = PokerScene.createShowcase(document.getElementById('cselStage')); } catch (e) { console.error(e); } }
  layoutShowcase(); if (showcase) showcase.start();
  if (scene3d) scene3d.setPaused(true);
  $cui.innerHTML = `
    <div class="top"><div class="brand">${home ? 'Bullet Poker' : 'Choose your character'}</div>${home ? '' : '<button class="btn ghost small" id="cBack">Back</button>'}</div>
    <button class="arrow prev" id="cPrev" aria-label="Previous character">‹</button>
    <button class="arrow next" id="cNext" aria-label="Next character">›</button>
    <div class="info ${home ? 'home' : ''}">
      <div class="idx" id="cIdx"></div>
      <div id="cHead"></div>
      <p class="blurb" id="cBlurb"></p>
      <p class="note" id="cTaken" hidden>Someone at this table already plays this one.</p>
      ${home ? `<label class="field"><span class="label">Your name</span><input type="text" id="pName" maxlength="14" placeholder="e.g. Nam" value="${esc(profile.name)}" autocomplete="nickname"></label>
      ${!scene3d ? '<p class="note">This browser could not start WebGL, so the 3D table cannot be drawn.</p>' : ''}
      <p class="note" id="cNotice" ${notice ? '' : 'hidden'} role="alert">${esc(notice)}</p>
      <div class="lob">
        <section><div class="row" style="justify-content:space-between"><h3>Open tables</h3><span class="sub" style="font-size:12px" id="lobbyStatus" aria-live="polite"></span></div>
          <div class="rooms" id="roomList"></div></section>
        <div class="cols2">
          <section><h3>Host a table</h3>
            <label class="field"><span class="label">Table name</span><input type="text" id="rName" maxlength="24" placeholder="${esc(profile.name || 'My')}'s table" value="${esc(roomPrefs.name)}"></label>
            <label class="check"><input type="checkbox" id="rPublic" ${roomPrefs.isPublic ? 'checked' : ''}> Show in the open tables list</label>
            <button class="btn" id="host">Host</button></section>
          <section><h3>Join with a code</h3>
            <label class="field"><span class="label">Table code</span><input type="text" id="jCode" maxlength="8" placeholder="e.g. K7Q2M" value="${esc(joinCode)}" autocapitalize="characters" style="text-transform:uppercase;letter-spacing:.2em"></label>
            <button class="btn" id="join">Join</button></section>
        </div>
      </div>
      <button class="linkbtn" id="cRules" aria-expanded="false">How to play</button>
      <div class="crules" id="cRulesBox" hidden>
        <div class="rtabs" role="tablist">${Object.keys(RULES).map(m => `<button class="rtab ${m === rulesMode ? 'on' : ''}" role="tab" aria-selected="${m === rulesMode}" data-rules="${m}">${MODE_INFO[m].name}</button>`).join('')}</div>
        <div id="cRulesBody">${RULES[rulesMode]}</div></div>`
      : `<div class="actions"><button class="btn" id="cGo">Play as this one</button></div>`}
    </div>
    <div class="strip" role="radiogroup" aria-label="Character">${KEYS.map((k, i) => `<button class="thumb" data-i="${i}" role="radio" aria-label="${CH[k].name}, ${CH[k].animal}">${portraits[k] ? `<img src="${portraits[k]}" alt="">` : esc(CH[k].name[0])}</button>`).join('')}</div>`;
  const nameEl = document.getElementById('pName');
  if (nameEl) nameEl.oninput = () => { profile.name = nameEl.value; saveProfile(); selectNotice(''); const rn = document.getElementById('rName'); if (rn) rn.placeholder = `${profile.name || 'My'}'s table`; };
  if (home) {
    document.getElementById('rName').oninput = e => roomPrefs.name = e.target.value;
    document.getElementById('rPublic').onchange = e => roomPrefs.isPublic = e.target.checked;
    document.getElementById('jCode').oninput = e => joinCode = NET.cleanCode(e.target.value);
    onClick('host', hostTable);
    onClick('join', () => joinCode ? joinTable(joinCode) : (selectNotice('Type a table code first.'), document.getElementById('jCode').focus()));
    updateRoomList();
  }
  onClick('cPrev', () => stepSelect(-1)); onClick('cNext', () => stepSelect(1));
  onClick('cGo', confirmSelect);
  onClick('cBack', () => { const c = csel; closeSelect(); c && c.onClose && c.onClose(); });
  $cui.querySelectorAll('[data-rules]').forEach(el => el.onclick = () => {
    rulesMode = el.dataset.rules; audio.play('ui');
    $cui.querySelectorAll('[data-rules]').forEach(b => { b.classList.toggle('on', b === el); b.setAttribute('aria-selected', String(b === el)); });
    document.getElementById('cRulesBody').innerHTML = RULES[rulesMode]; document.getElementById('cRulesBox').scrollTop = 0;
  });
  onClick('cRules', () => { const b = document.getElementById('cRulesBox'), t = document.getElementById('cRules'); b.hidden = !b.hidden; t.setAttribute('aria-expanded', String(!b.hidden)); });
  $cui.querySelectorAll('.thumb[data-i]').forEach(el => el.onclick = () => { audio.unlock(); csel.index = +el.dataset.i; audio.play('flick'); renderSelect(); });
  renderSelect();
}
function renderSelect(){
  if (!csel) return;
  const k = KEYS[csel.index], c = CH[k], taken = csel.taken.has(k);
  if (showcase) showcase.show(k);
  if (csel.mode === 'home' && profile.animal !== k) { profile.animal = k; saveProfile(); } // home: picking is choosing
  document.getElementById('cIdx').textContent = `${String(csel.index + 1).padStart(2, '0')} / ${String(KEYS.length).padStart(2, '0')}`;
  document.getElementById('cHead').innerHTML = `<div class="cname">${esc(c.name)}</div><div class="species">${esc(c.animal)}</div>`;
  document.getElementById('cBlurb').textContent = c.blurb;
  document.getElementById('cTaken').hidden = !taken;
  const go = document.getElementById('cGo'); if (go) go.disabled = taken;
  $cui.querySelectorAll('.thumb[data-i]').forEach(el => {
    const i = +el.dataset.i, on = i === csel.index;
    el.classList.toggle('sel', on); el.classList.toggle('taken', csel.taken.has(KEYS[i]) && !on);
    el.setAttribute('aria-checked', String(on));
    if (on) el.scrollIntoView({block: 'nearest', inline: 'nearest'});
  });
}
function stepSelect(d){ if (!csel) return; csel.index = (csel.index + d + KEYS.length) % KEYS.length; audio.play('flick'); renderSelect(); }
function confirmSelect(){
  if (!csel || csel.mode === 'home') return;
  const k = KEYS[csel.index];
  if (csel.taken.has(k)) return;
  audio.play('clink');
  const c = csel;
  if (c.onConfirm(k) !== false && csel === c) closeSelect();
}
function selectNotice(t){ const n = document.getElementById('cNotice'); if (n) { n.textContent = t; n.hidden = !t; } }
function updateTaken(t){ if (csel) { csel.taken = t; renderSelect(); } }
function closeSelect(){ csel = null; $csel.hidden = true; $cui.innerHTML = ''; if (showcase) showcase.stop(); if (scene3d) scene3d.setPaused(false); }
document.addEventListener('keydown', e => {
  if (!csel) return;
  if (e.target && e.target.matches && e.target.matches('input,textarea')) {
    if (e.key === 'Enter' && csel.mode === 'home') { if (e.target.id === 'jCode') document.getElementById('join').click(); else if (e.target.id === 'rName') document.getElementById('host').click(); }
    return;
  }
  if (e.key === 'ArrowLeft') { e.preventDefault(); stepSelect(-1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); stepSelect(1); }
  else if (e.key === 'Enter' && !(e.target && e.target.closest && e.target.closest('button'))) { e.preventDefault(); confirmSelect(); }
  else if (e.key === 'Escape' && csel.mode !== 'home') { const c = csel; closeSelect(); c.onClose && c.onClose(); }
}, true);
// swipe across the stage to change character
{ let x0 = null; const st = document.getElementById('cselStage');
  st.addEventListener('pointerdown', e => { x0 = e.clientX; });
  st.addEventListener('pointerup', e => { if (x0 != null && Math.abs(e.clientX - x0) > 50) stepSelect(e.clientX < x0 ? 1 : -1); x0 = null; }); }
window.addEventListener('resize', () => { if (csel) layoutShowcase(); });

// How to play: one rulebook per mode, written from game.js / liars.js (keep them in step).
const RULES_POKER = `<div class="rulebook">
  <h4>Goal</h4>
  <p>Texas Hold'em, but you bet <b>bullets</b> instead of chips, and losing means pulling the trigger. Be the <b>last player alive</b>. 2–4 players, each on their own device.</p>
  <h4>A hand, step by step</h4>
  <ol>
    <li>Everyone still alive starts the hand with <b>1 bullet loaded</b> (the ante). The dealer button moves one seat to the left each hand.</li>
    <li>Each player gets <b>2 hole cards</b> that only they can see.</li>
    <li>Four betting rounds: <b>pre-flop</b>, then the <b>flop</b> (3 shared cards), the <b>turn</b> (1 more) and the <b>river</b> (1 more). Each round starts with the player left of the dealer.</li>
    <li>A betting round ends when everyone still in has acted and has the same number of bullets loaded.</li>
    <li><b>Showdown:</b> the players still in reveal their cards. Each makes the best 5-card hand from their 2 cards plus the 5 shared ones. The best hand is <b>safe</b>; every other player still in <b>pulls the trigger</b> with all the bullets they loaded. Tied best hands are all safe.</li>
    <li>If everyone else folds, the last player in wins the hand without a showdown and is safe.</li>
  </ol>
  <h4>Your actions</h4>
  <ul>
    <li><b>Check</b>: when you already match the highest load, pass.</li>
    <li><b>Call</b>: load bullets until you match the highest load at the table.</li>
    <li><b>Raise</b>: load 1 bullet more than the highest load. Everyone else must answer again.</li>
    <li><b>All-in</b>: go straight to <b>6 bullets</b>, a full cylinder. Everyone must call 6 or fold.</li>
    <li><b>Fold</b>: give up the hand and <b>pull the trigger right away</b> with the bullets you have loaded. Folding is not free: you only escape bullets you never loaded.</li>
  </ul>
  <h4>The gun</h4>
  <ul>
    <li>A six-chamber revolver. With <b>k bullets</b> loaded, the chance of death is <b>k in 6</b>: 1 bullet is 17%, 3 bullets 50%, 5 bullets 83%.</li>
    <li>With all <b>6 loaded</b> you are not quite dead: there is a <b>5% God Save</b>, when the hammer falls on nothing.</li>
    <li>The bullets you see in front of a player are what they would load. The risk line under your buttons shows your odds for folding and for calling and losing.</li>
  </ul>
  <h4>Once per match</h4>
  <ul>
    <li><b>Coward's Fold</b>: fold and take only <b>1 bullet</b>, however many you had loaded (only when you have more than 1 loaded).</li>
    <li><b>Switch</b>: on your turn before the river, see <b>4 / 3 / 2</b> new cards (pre-flop / flop / turn) and swap one of your hole cards for one of them, or keep yours. You can't go All-in on the turn you Switch.</li>
  </ul>
  <h4>Hand rankings (best first)</h4>
  <div class="ranks">
    <b>Royal Flush</b><span>A K Q J 10, all one suit</span>
    <b>Straight Flush</b><span>five in a row, one suit</span>
    <b>Four of a Kind</b><span>four cards of one rank</span>
    <b>Full House</b><span>three of a kind plus a pair</span>
    <b>Flush</b><span>any five of one suit</span>
    <b>Straight</b><span>five in a row, mixed suits (A can be low: A 2 3 4 5)</span>
    <b>Three of a Kind</b><span>three cards of one rank</span>
    <b>Two Pair</b><span>two different pairs</span>
    <b>Pair</b><span>two cards of one rank</span>
    <b>High Card</b><span>none of the above: highest card wins</span>
  </div>
  <h4>Tips</h4>
  <ul>
    <li>Every bullet you load stays loaded until the hand ends. Fold early if your cards are bad: it only costs the ante.</li>
    <li>An All-in from someone with a weak table is often a bluff. Calling it can cost you a full cylinder.</li>
  </ul>
  <h4>Keys</h4>
  <p><b>F</b> fold · <b>C</b> check / call · <b>R</b> raise · <b>A</b> all-in · <b>S</b> switch · <b>B</b> board view · <b>M</b> music</p>
</div>`;
const RULES = {
  poker: RULES_POKER,
  deck: `<div class="rulebook">
  <h4>Goal</h4>
  <p>A bluffing card game. Play cards face down, claim they are the <b>table card</b>, and catch the liars. Be the <b>last player alive</b>. 2–4 players.</p>
  <h4>The cards</h4>
  <p><b>20 cards</b>: 6 Kings, 6 Queens, 6 Aces and 2 <b>Jokers</b>. Jokers are wild: they always count as the table card. Every round, each player gets <b>5 cards</b> and the game names a table card: <b>Kings</b>, <b>Queens</b> or <b>Aces</b>.</p>
  <h4>A round, step by step</h4>
  <ol>
    <li>Players take turns around the table. On your turn you either <b>play</b> or call <b>Liar</b>.</li>
    <li><b>Play</b>: put <b>1, 2 or 3 cards</b> face down and claim they are all the table card. Nobody sees them. You may lie.</li>
    <li><b>Liar!</b>: accuse the player who made the <b>last play</b>. Their cards flip over:
      <ul><li>if <b>any</b> card is neither the table card nor a Joker, they <b>lied</b>, and <b>they</b> pull the trigger;</li>
      <li>if every card was the table card or a Joker, they told the truth, and <b>you</b> pull the trigger.</li></ul></li>
    <li>Players with no cards left are skipped. If nobody else has cards, the next player <b>must</b> call Liar.</li>
    <li>After the shot, all cards are collected, everyone gets 5 new cards and a new table card. The player who pulled the trigger starts the next round (or the next player, if they died).</li>
  </ol>
  <h4>The gun</h4>
  <ul>
    <li>Every player has their <b>own revolver</b>: 6 chambers with <b>1 live round</b> in a random chamber. Nobody at the table can see where it is.</li>
    <li>Each pull moves your cylinder on, and it keeps its place between rounds. So your first pull is 1 in 6, then 1 in 5, 1 in 4, ... and the sixth is certain death.</li>
    <li>The marks under each name show how many pulls that player has used.</li>
  </ul>
  <h4>Tips</h4>
  <ul>
    <li>Count: there are only 6 of each rank plus 2 Jokers. If you hold four Queens, someone claiming three more is probably lying.</li>
    <li>Someone near their last chambers can't afford a wrong Liar call. Use it.</li>
  </ul>
  <h4>Keys</h4>
  <p><b>1–5</b> pick cards · <b>Enter</b> play · <b>L</b> Liar · <b>M</b> music</p>
</div>`,
  dice: `<div class="rulebook">
  <h4>Goal</h4>
  <p>A bluffing dice game. Bid on what is under everyone's cups and catch the liars. Be the <b>last player alive</b>. 2–4 players.</p>
  <h4>The dice</h4>
  <p>Every player has <b>5 dice</b> under a cup, rolled fresh each round. You see <b>only your own</b>. <b>Ones are wild</b>: they count as every face.</p>
  <h4>A round, step by step</h4>
  <ol>
    <li>Players take turns around the table. On your turn you either <b>bid</b> or call <b>Liar</b>.</li>
    <li><b>Bid</b>: claim that <b>at least</b> so many dice on the <b>whole table</b> show one face, e.g. <b>"five 4s"</b>. Faces are <b>2 to 6</b> (ones are wild, so you can't bid them).</li>
    <li>Each bid must beat the last one: a <b>higher quantity</b> (any face), or the <b>same quantity with a higher face</b>. "Five 4s" can be followed by "five 5s", "five 6s" or "six 2s", but not "four 6s".</li>
    <li><b>Liar!</b>: challenge the last bid. All cups lift and the dice are counted, ones included:
      <ul><li>if there are <b>fewer</b> than bid, the <b>bidder</b> lied and pulls the trigger;</li>
      <li>if there are <b>at least</b> as many, the bid stands and <b>you</b> pull the trigger.</li></ul></li>
    <li>If no higher bid is possible any more, you must call Liar.</li>
    <li>After the shot, everyone rolls again. The player who pulled the trigger starts the next round (or the next player, if they died).</li>
  </ol>
  <h4>The gun</h4>
  <p>The same as Liar's Deck: your <b>own revolver</b> with <b>1 live round</b> in 6 chambers. Every pull makes the next one likelier: 1 in 6, 1 in 5, ... until the sixth.</p>
  <h4>Tips</h4>
  <ul>
    <li>On average a third of all dice show any one face once ones are counted (1 in 6 for the face, plus 1 in 6 for wild ones). With 4 players, 20 dice: about 6 or 7 of each face.</li>
    <li>Your own dice are the only facts you have. Bid on faces you hold.</li>
  </ul>
  <h4>Keys</h4>
  <p><b>↑ ↓</b> quantity · <b>2–6</b> face · <b>Enter</b> bid · <b>L</b> Liar · <b>M</b> music</p>
</div>`,
};

/* ---------- screen 2: lobby (open tables, host, join by code) ---------- */
function showLobby(){
  if (!lobbyStop) lobbyStop = NET.watchLobby(list => { lobbyRooms = list; if (!session) updateRoomList(); }, st => { lobbyStatus = st; if (!session) updateRoomList(); });
  renderLobby();
}
function lobbyStatusText(){
  return lobbyStatus === 'online' ? `${lobbyRooms.length} open table${lobbyRooms.length === 1 ? '' : 's'}` : lobbyStatus === 'unavailable' ? 'Table list unavailable. You can still host or join with a code.' : 'Looking for tables...';
}
function roomListHTML(){
  return lobbyRooms.length ? lobbyRooms.map(r => {
    const full = r.players >= NET.MAX_SEATS, playing = r.status === 'playing';
    return `<div class="roomrow"><div class="rinfo"><b>${esc(r.name)}</b><span>${MODE_INFO[r.mode].name} · Host: ${esc(r.host)}</span></div>
      <span class="pill ${playing ? 'busy' : ''}">${playing ? 'In game' : `${r.players}/${NET.MAX_SEATS}`}</span>
      <button class="btn small" data-join="${esc(r.code)}" ${full || playing ? 'disabled' : ''}>Join</button></div>`;
  }).join('') : '<div class="empty">No public tables right now. Host one!</div>';
}
// Refresh only the table list (re-rendering the whole lobby would steal focus from the inputs).
function updateRoomList(){
  const list = document.getElementById('roomList'), st = document.getElementById('lobbyStatus');
  if (!list || !st) return;
  st.textContent = lobbyStatusText();
  list.innerHTML = roomListHTML();
  list.querySelectorAll('[data-join]').forEach(el => el.onclick = () => { audio.unlock(); audio.play('ui'); joinTable(el.dataset.join); });
}
function renderLobby(){
  $hud.innerHTML = ''; $ov.innerHTML = '';
  if (csel && csel.mode === 'home') { selectNotice(notice); updateRoomList(); return; } // already open: don't steal focus
  openSelect({mode: 'home', current: profile.animal});
}
// Hosting and joining need a name: say so on the home screen instead of failing later.
function needName(){
  if (profile.name.trim()) return false;
  notice = 'Pick a name first.'; selectNotice(notice);
  const n = document.getElementById('pName'); if (n) n.focus();
  return true;
}

/* ---------- host / join ---------- */
function hostTable(){
  if (needName()) return;
  notice = ''; closeSelect();
  try {
    const net = NET.hostRoom({me: profile, roomName: roomPrefs.name, isPublic: roomPrefs.isPublic, mode: roomPrefs.mode,
      onRoom: room => { if (session && session.net === net) { session.room = room; if (!session.game) renderRoom(); } },
      onError: msg => { notice = msg; leaveSession(); }});
    session = {mode: 'host', net, room: net.room, seat: 0};
    renderRoom();
  } catch (e) { notice = e.message; renderLobby(); }
}
function joinTable(code){
  if (needName()) return;
  notice = ''; closeSelect();
  let net;
  try {
    net = NET.joinRoom({code, me: profile,
      onRoom: (room, key) => { if (!session) return; session.room = room; session.key = key; if (!session.inGame) renderRoom(); },
      onState: (S, seat) => onGuestState(S, seat),
      onEvent: (t, d) => session && session.S && onEvent(t, d, session.S),
      onLobby: () => { if (session) { session.inGame = false; session.S = null; resetTable(); renderRoom(); } },
      onClose: reason => { notice = reason; leaveSession(); }});
  } catch (e) { notice = e.message; return renderLobby(); }
  session = {mode: 'guest', net, room: null, seat: null, code: NET.cleanCode(code)};
  renderRoom();
}
function leaveSession(){
  if (session) {
    if (session.game) session.game.stop();
    if (session.mode === 'host') session.net.close(); else session.net.leave();
  }
  session = null; viewer = null; sw = null;
  resetTable();
  if (location.hash) history.replaceState(null, '', location.pathname);
  showLobby();
}
function resetTable(){ audio.tension(false); vignette(null); volOpen = false; $vol.hidden = true; boardOpen = false; if (scene3d) { scene3d.setBoardView(false); scene3d.setup([]); } $hud.innerHTML = ''; }

/* ---------- screen 3: the room (waiting to start) ---------- */
function renderRoom(){
  $hud.innerHTML = '';
  const r = session.room, isHost = session.mode === 'host';
  if (!r) {
    $ov.innerHTML = `<div class="overlay dim"><div class="panel" style="width:min(460px,100%)"><div class="label">Joining ${esc(session.code)}</div><h2>Knocking on the door...</h2>
      <p class="sub">Connecting to the host's browser. This can take a few seconds.</p><button class="btn ghost" id="leave">Cancel</button></div></div>`;
    return onClick('leave', leaveSession);
  }
  const myKey = isHost ? 'host' : session.key;
  const me = r.seats.find(s => s.key === myKey);
  const taken = new Set(r.seats.filter(s => s.key !== myKey).map(s => s.animal));
  const canStart = r.seats.length >= 2;
  $ov.innerHTML = `<div class="overlay dim"><div class="panel">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div><div class="label">${r.isPublic === false ? 'Private table' : 'Public table'}</div><h1 style="font-size:clamp(26px,5vw,40px)">${esc(r.name)}</h1></div>
      <div class="codebox"><span class="label">Table code</span><b>${esc(r.code)}</b></div>
    </div>
    <div class="row" style="justify-content:flex-start"><input type="text" id="invite" readonly value="${esc(inviteLink(r.code))}" class="invite" aria-label="Invite link"><button class="btn ghost small" id="copy">Copy invite link</button></div>
    <div class="seats4">${Array.from({length: NET.MAX_SEATS}, (_, i) => {
      const s = r.seats[i];
      if (!s) return `<div class="seatcard empty"><div class="ph">?</div><span>Empty seat</span></div>`;
      return `<div class="seatcard ${s.key === myKey ? 'me' : ''}">${portraits[s.animal] ? `<img src="${portraits[s.animal]}" alt="${CH[s.animal].animal}">` : ''}
        <b>${esc(s.name)}</b><span>${CH[s.animal].name}${s.host ? ' · Host' : ''}${s.key === myKey ? ' · You' : ''}</span></div>`;
    }).join('')}</div>
    <div><span class="label">Game</span><div class="modes" role="radiogroup" aria-label="Game mode">${NET.MODES.map(m => `<button class="modebtn ${r.mode === m ? 'sel' : ''}" data-mode="${m}" role="radio" aria-checked="${r.mode === m}" ${isHost ? '' : 'disabled'}><b>${MODE_INFO[m].name}</b><span>${MODE_INFO[m].blurb}</span></button>`).join('')}</div>
      <details style="margin-top:8px"><summary>How to play ${MODE_INFO[r.mode].name}</summary>${RULES[r.mode]}</details></div>
    ${me ? `<div class="row" style="justify-content:flex-start"><button class="btn ghost small" id="changeChar">Change character</button><span class="sub" style="font-size:13px">You are ${esc(CH[me.animal].name)}, the ${esc(CH[me.animal].animal.toLowerCase())}.</span></div>` : ''}
    <div class="row" style="justify-content:flex-start">
      ${isHost ? `<button class="btn" id="start" ${canStart ? '' : 'disabled'}>Start game (${r.seats.length} player${r.seats.length === 1 ? '' : 's'})</button>` : ''}
      <button class="btn ghost" id="leave">${isHost ? 'Close table' : 'Leave'}</button>
      <span class="sub" style="font-size:13px">${isHost ? (canStart ? 'Everyone in? Start when ready.' : 'Waiting for at least one more player. Share the code or the link.') : 'Waiting for the host to start...'}</span>
    </div>
  </div></div>`;
  onClick('changeChar', () => openSelect({mode: 'room', current: me.animal, taken, onConfirm(k) { if (k !== me.animal) session.net.pickAnimal(k); }}));
  if (csel && csel.mode === 'room') updateTaken(taken); // someone else picked while the select is open
  onClick('copy', () => {
    const el = document.getElementById('invite'), btn = document.getElementById('copy');
    const done = () => { btn.textContent = 'Copied'; }, manual = () => { el.select(); btn.textContent = 'Press Ctrl/Cmd+C'; };
    try { navigator.clipboard.writeText(el.value).then(done, manual); } catch { manual(); }
  });
  onClick('leave', leaveSession);
  onClick('start', startHostedGame);
  if (isHost) $ov.querySelectorAll('[data-mode]').forEach(el => el.onclick = () => {
    audio.play('ui'); roomPrefs.mode = el.dataset.mode;
    try { localStorage.setItem('bp-mode', roomPrefs.mode); } catch {}
    session.net.setMode(el.dataset.mode);
  });

}

/* ---------- running a game ---------- */
function startHostedGame(){
  const net = session.net;
  const seats = net.seatsForGame();
  const make = {poker: PokerGame.createGame, deck: LiarsGame.createDeck, dice: LiarsGame.createDice}[net.mode];
  const game = make(seats, S => { net.pushState(S); render(); }, {onEvent: (t, d, S) => { net.pushEvent(t, d); onEvent(t, d, S); }});
  closeSelect();
  session.game = game; session.inGame = true; viewer = 0; sw = null; turnKey = '';
  net.attach(game);
  $ov.innerHTML = '';
  if (scene3d) scene3d.setup(game.state.players);
  game.start();
}
function onGuestState(S, seat){
  if (!session) return;
  const fresh = session.gameId !== S.gameId;
  if (!session.inGame) closeSelect();
  session.S = S; session.seat = seat; session.inGame = true; viewer = seat;
  if (fresh) { session.gameId = S.gameId; sw = null; turnKey = ''; boardOpen = false; $ov.innerHTML = ''; if (scene3d) { scene3d.setBoardView(false); scene3d.setup(S.players); } }
  render();
}
const curState = () => session && (session.mode === 'host' ? session.game && session.game.state : session.S);
const ctl = {
  act(a) { if (session.mode === 'host') session.game.act(a); else session.net.send({t: 'act', a}); },
  switchOpen() { if (session.mode === 'host') session.game.switchOpen(viewer); else session.net.send({t: 'swOpen'}); },
  switchPick(h, o) { if (session.mode === 'host') session.game.switchPick(viewer, h, o); else session.net.send({t: 'swPick', h, o}); },
};

/* ---------- game events → sound + faces ---------- */
function onEvent(type, d, S){
  const talk = () => scene3d && d.pid != null && scene3d.react(d.pid, 'talk');
  // body language: knock to check, push bullets or cards forward, toss a fold, slam the table on Liar
  const gest = kind => scene3d && d.pid != null && scene3d.react(d.pid, kind);
  switch (type) {
    case 'deal': audio.play('deal', {count: d.count, delay: PokerScene.DEAL.shuffle, gap: PokerScene.DEAL.gap[S.mode] || PokerScene.DEAL.gap.poker}); break;
    case 'board': audio.play('board', d.count); break;
    case 'check': audio.play('check'); talk(); gest('knock'); break;
    case 'bet': audio.play('bet', d.added); talk(); gest('push'); break;
    case 'allin': audio.play('allin'); talk(); gest('push2'); break;
    case 'fold': audio.play('fold'); talk(); gest('toss'); break;
    case 'switch': audio.play('switch'); break;
    case 'loadStart': audio.play('loadStart'); audio.tension(true); vignette(d.pid); break;
    case 'loadBullet': audio.play('loadBullet'); break;
    case 'aim': audio.play('spin'); if (S.mode === 'deck' || S.mode === 'dice') audio.tension(true); vignette(d.pid); break;
    case 'click': audio.play('click'); audio.tension(false); vignette(null); break;
    case 'godsave': audio.play('godSave'); audio.tension(false); vignette(null); flashGold(); break;
    case 'bang': audio.play('bang', d.pid === viewer); audio.tension(false); vignette(null); if (d.pid === viewer) setTimeout(() => audio.play('lose'), 600); flashRed(); break;
    case 'gunDown': vignette(null); break;
    case 'win': case 'showdown': audio.play('win'); if (scene3d) d.ids.forEach(id => scene3d.react(id, 'happy')); break;
    case 'yourTurn': if (d.pid === viewer) audio.play('yourTurn'); break;
    case 'gameOver': audio.play(d.winner === viewer ? 'win' : 'lose'); break;
    case 'roll': audio.play('dice', d.count); break;
    case 'play': audio.play('slap', {n: d.n}); talk(); gest('push'); break;
    case 'bid': audio.play('bet', 1); talk(); gest('push'); break;
    case 'liar': audio.play('liar'); talk(); gest('slam'); if (scene3d && S.result) scene3d.react(S.result.accused, 'talk'); break;
    case 'reveal': audio.play(S.mode === 'dice' ? 'dice' : 'switch', 2); break;
  }
}
/* ---------- volume panel ---------- */
let volOpen = false;
const $vol = document.getElementById('volpanel');
function syncVolume(){
  for (const [id, v] of [['volMusic', audio.musicVolume], ['volSfx', audio.sfxVolume]]) {
    const pct = Math.round(v * 100);
    document.getElementById(id).value = pct;
    document.getElementById(id + 'Out').textContent = pct;
  }
}
function toggleVolume(open = !volOpen){ volOpen = open; $vol.hidden = !open; if (open) syncVolume(); render(); }
document.getElementById('volMusic').addEventListener('input', e => { audio.setMusicVolume(e.target.value / 100); syncVolume(); });
document.getElementById('volSfx').addEventListener('input', e => { audio.setSfxVolume(e.target.value / 100); syncVolume(); });
// a tick on release so you hear the new effects level
document.getElementById('volSfx').addEventListener('change', () => audio.play('clink'));
document.addEventListener('pointerdown', e => { if (volOpen && !$vol.contains(e.target) && !e.target.closest('#tVol')) toggleVolume(false); });
function flashGold(){ const f = document.getElementById('goldflash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on'); }
function vignette(pid){ const v = document.getElementById('vignette'); v.classList.toggle('on', pid != null); v.classList.toggle('self', pid != null && pid === viewer); }
function flashRed(){ const f = document.getElementById('redflash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on'); }

/* ---------- showdown board + cylinder ---------- */
function resultsHTML(S){
  const live = S.players.filter(p => p.inHand && !p.folded && p.hole.length === 2);
  const rows = live.map(p => { const b = E.bestHand(p.hole.concat(S.board)); return {p, b, r: E.handRank10(b)}; })
    .sort((a, b) => b.b.score - a.b.score);
  return `<div class="results" aria-live="polite">
    <div class="rboard"><span class="gem t"></span>${S.board.map(c => card2d(c, 'res')).join('')}<span class="gem b"></span></div>
    ${rows.map(({p, r}) => {
      const win = S.winners.includes(p.id);
      return `<div class="rrow ${win ? 'win' : ''}"><div class="rname">${esc(p.name)}</div>
        <div class="rcards">${p.hole.map(c => card2d(c, 'res')).join('')}</div>
        <div class="rhand"><span class="ord">${r.place}<sup>${r.suffix}</sup></span><span>${r.name}</span>
          <span class="rtag ${win ? 'safe' : 'shoot'}">${win ? 'SAFE' : 'PULLS ' + p.bet}</span></div></div>`;
    }).join('')}
  </div>`;
}
let lastLoaded = 0;
function cylinderHTML(g, p){
  const holes = Array.from({length: 6}, (_, c) => {
    const a = (c * 60 - 90) * Math.PI / 180, x = Math.cos(a) * 31, y = Math.sin(a) * 31;
    if (g.spent != null) return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><circle class="ch ${c < g.spent ? 'spent' : ''}" r="12"/>${c === g.spent ? '<circle class="cur" r="15"/>' : ''}</g>`;
    const full = g.state === 'load' ? c < g.loaded : c < g.bullets;
    const pop = g.state === 'load' && c === g.loaded - 1 && g.loaded !== lastLoaded;
    return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><circle class="ch ${full ? 'full' : ''} ${pop ? 'pop' : ''}" r="12"/>${full ? '<circle class="pr" r="4"/>' : ''}</g>`;
  }).join('');
  lastLoaded = g.state === 'load' ? g.loaded : 0;
  const caption = g.spent != null ? `${esc(p.name)} pulls the trigger · 1 in ${6 - g.spent}`
    : g.state === 'load' ? `${esc(p.name)} loads ${g.loaded} / ${g.bullets}` : `${esc(p.name)} pulls the trigger · ${g.bullets} of 6`;
  return `<div class="cylwrap"><svg class="cylsvg ${g.state === 'aim' ? 'spin' : ''}" viewBox="-60 -60 120 120" aria-hidden="true">
    <circle r="56" fill="#2c2c2e" stroke="#6a6a6a" stroke-width="3"/>${[0,1,2,3,4,5].map(c => { const a = (c * 60 - 60) * Math.PI / 180; return `<circle cx="${(Math.cos(a)*50).toFixed(1)}" cy="${(Math.sin(a)*50).toFixed(1)}" r="5" fill="#1a1a1a"/>`; }).join('')}
    <circle r="9" fill="#151515"/>${holes}</svg><div class="shot aim">${caption}</div></div>`;
}
function musicIntensity(S){
  if (S.mode === 'deck' || S.mode === 'dice') {
    const worst = Math.max(...S.players.filter(p => p.alive).map(p => p.shots));
    return Math.min(3, (S.reveal ? 2 : S.mode === 'deck' ? (S.last ? 1 : 0) : (S.bid ? 1 : 0)) + (worst >= 3 ? 1 : 0));
  }
  if (S.showdown) return 2;
  if (S.currentBet >= 5) return 3;
  if (S.currentBet >= 3) return 2;
  if (S.board.length >= 3 || S.currentBet >= 2) return 1;
  return 0;
}

/* ---------- per-mode HUD pieces: {label, controls, results, extra} ---------- */
function pokerHUD(S, me, myTurn){
  const results = S.showdown && S.winners && !S.gun ? resultsHTML(S) : '';
  const board = boardOpen ? `<div class="chip boardstrip"><div class="label">Community cards · ${STREET_NAME[S.street] || ''}</div><div class="row">${Array.from({length:5}, (_, i) => card2d(S.board[i], 'mini')).join('')}</div></div>` : '';
  let controls = '';
  if (me && !S.over) {
    const best = me.hole.length === 2 ? (S.board.length >= 3 ? E.bestHand(me.hole.concat(S.board)).name : (me.hole[0].r === me.hole[1].r ? 'Pocket pair' : '')) : '';
    let buttons = '';
    if (myTurn && !sw) {
      const o = PokerGame.optionsFor(S, me);
      buttons = `<div class="row">
        <button class="btn fold" id="aFold">Fold · take ${o.bet}<kbd>F</kbd></button>
        ${o.canCoward ? `<button class="btn ghost" id="aCoward">Coward's Fold · take 1</button>` : ''}
        <button class="btn" id="aCall">${o.canCheck ? 'Check' : `Call · load ${o.currentBet}`}<kbd>C</kbd></button>
        ${o.canRaise ? `<button class="btn ghost" id="aRaise">Raise to ${o.currentBet + 1}<kbd>R</kbd></button>` : ''}
        ${o.canAllIn ? `<button class="btn red" id="aAll">ALL-IN · 6<kbd>A</kbd></button>` : ''}
        ${o.canSwitch ? `<button class="btn ghost" id="aSwitch">Switch · ${o.switchCount} offers<kbd>S</kbd></button>` : ''}
      </div>
      <div class="risk">Fold now: <b>${Math.round(o.bet / 6 * 100)}%</b> death · Call and lose: <b>${o.currentBet >= 6 ? 95 : Math.round(o.currentBet / 6 * 100)}%</b> death</div>`;
    } else if (myTurn && sw) {
      const offer = S.switchOffer && S.switchOffer.pid === viewer ? S.switchOffer.cards : null;
      buttons = !offer ? `<div class="risk">Shuffling the offer...</div>` : `<div class="chip" style="display:grid;gap:10px;justify-items:center">
        <div class="label">Switch: pick a new card, then the hole card to give up</div>
        <div class="row">${offer.map((c, k) => card2d(c, 'pick ' + (sw.pick === k ? 'sel' : ''), `data-offer="${k}" role="button" tabindex="0"`)).join('')}</div>
        <div class="label">Your hole cards</div>
        <div class="row">${me.hole.map((c, k) => card2d(c, 'pick', `data-hole="${k}" role="button" tabindex="0"`)).join('')}</div>
        <button class="btn ghost small" id="swCancel">Keep my cards</button></div>`;
    } else {
      buttons = `<div class="risk">${!me.alive ? "You're out. Stick around and watch." : me.folded ? 'You folded. Wait for the next hand.' : S.gun ? '' : 'Waiting for the others...'}</div>`;
    }
    controls = `<div class="chip mine">${me.hole.length && !sw ? `<div class="row">${me.hole.map(c => card2d(c, 'mini')).join('')}</div>` : ''}
        <div><div class="label">${esc(me.name)} · loaded</div>${bulletsHTML(me.bet)}</div>${best ? `<div class="big">${best}</div>` : ''}
        <span class="label hide-sm">${me.switchUsed ? '' : 'Switch ready'}${!me.switchUsed && !me.cowardUsed ? ' · ' : ''}${me.cowardUsed ? '' : 'Coward ready'}</span></div>
      ${buttons}`;
  }
  return {label: `Hand ${S.handNo} · ${STREET_NAME[S.street] || ''} · to call ${S.currentBet}`, controls, results, extra: board};
}

const RN = LiarsGame.RANK_NAME;
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const lcard = (c, cls = '', attrs = '') => c && !c.hidden
  ? `<div class="card2d lc ${c.k === 'J' ? 'red' : ''} ${cls}" ${attrs} aria-label="${RN[c.k]}"><span class="r">${c.k === 'J' ? '★' : c.k}</span><span class="s">${RN[c.k].toUpperCase()}</span></div>`
  : `<div class="card2d back ${cls}"></div>`;
const pullsHTML = n => `<span class="bullets" aria-label="${n} of 6 trigger pulls used">${'×'.repeat(n)}<span class="emp">${'○'.repeat(Math.max(0, 6 - n))}</span></span>`;
const pullOdds = p => `next pull: <b>1 in ${Math.max(1, 6 - p.shots)}</b>`;
function verdictRow(S, inner){
  const r = S.result, loser = S.players[r.loser];
  return `<div class="rrow ${r.honest ? 'win' : ''}"><div class="rname">${esc(S.players[r.accused].name)}</div><div class="rcards">${inner}</div>
    <div class="rhand"><span>${r.honest ? 'Truth' : 'Lie'}</span><span class="rtag shoot">${esc(loser.name)} PULLS</span></div></div>`;
}
function deckHUD(S, me, myTurn){
  const label = `Round ${S.round} · Table of ${RN[S.table]}s`;
  const results = S.reveal && S.result && S.last && !S.gun ? `<div class="results" aria-live="polite">${verdictRow(S, S.last.cards.map(c => lcard(c, 'res')).join(''))}</div>` : '';
  const lastLine = S.last ? `${esc(S.players[S.last.pid].name)} played ${plural(S.last.n, 'card')}: "${plural(S.last.n, RN[S.table])}"` : 'No cards played yet this round';
  const extra = `<div class="chip tablecard"><div class="label">Table card</div>${lcard({k: S.table}, 'mini')}<div class="label">Jokers are wild</div></div>`;
  let controls = '';
  if (me && !S.over) {
    const o = LiarsGame.deckOptions(S, me);
    const canPick = myTurn && o.canPlay;
    const hand = me.hand.map((c, k) => lcard(c, `mini ${canPick ? 'pick' : ''} ${pick.includes(c.id) ? 'sel' : ''}`, canPick ? `data-card="${c.id}" role="button" tabindex="0" aria-pressed="${pick.includes(c.id)}"` : '')).join('');
    let buttons;
    if (myTurn) {
      const n = pick.length;
      buttons = `<div class="row">
        ${o.canPlay ? `<button class="btn" id="aPlay" ${n ? '' : 'disabled'}>${n ? `Play ${plural(n, RN[S.table])}` : `Pick 1–${o.maxPlay} cards`}<kbd>↵</kbd></button>` : ''}
        ${o.canLiar ? `<button class="btn red" id="aLiar">LIAR!<kbd>L</kbd></button>` : ''}</div>
        <div class="risk">${lastLine} · ${pullOdds(me)}</div>`;
    } else buttons = `<div class="risk">${!me.alive ? "You're out. Stick around and watch." : S.gun ? '' : `${lastLine}. Waiting for the others...`}</div>`;
    controls = `<div class="chip mine">${me.hand.length ? `<div class="row">${hand}</div>` : '<span class="label">No cards left</span>'}
      <div><div class="label">${esc(me.name)} · trigger pulls</div>${pullsHTML(me.shots)}</div></div>${buttons}`;
  }
  return {label, controls, results, extra};
}
const DIE_CH = ['', '⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
const die2d = (v, cls = '') => v ? `<span class="die2d ${v === 1 ? 'one' : ''} ${cls}" aria-label="${v}">${DIE_CH[v]}</span>` : `<span class="die2d hid ${cls}">?</span>`;
function diceHUD(S, me, myTurn){
  const label = `Round ${S.round} · ${S.bid ? `Bid ${S.bid.q} × ${S.bid.f}` : 'No bid yet'} · ones wild`;
  let results = '';
  if (S.reveal && S.result && !S.gun) {
    const r = S.result;
    results = `<div class="results" aria-live="polite"><div class="rboard"><span class="gem t"></span><span class="rhand"><span class="ord">${r.count}</span><span>× ${r.f} on the table · bid ${r.q}</span></span><span class="gem b"></span></div>
      ${S.players.filter(p => p.dice.length).map(p => `<div class="rrow"><div class="rname">${esc(p.name)}</div><div class="rcards">${p.dice.map(v => die2d(v, v === r.f || v === 1 ? 'hit' : 'miss')).join('')}</div><div class="rhand">${p.id === r.loser ? '<span class="rtag shoot">PULLS</span>' : ''}</div></div>`).join('')}</div>`;
  }
  const bidLine = S.bid ? `${esc(S.players[S.bid.pid].name)} bids <b>${S.bid.q} × ${S.bid.f}</b>` : 'Open the bidding';
  let controls = '';
  if (me && !S.over) {
    const o = LiarsGame.diceOptions(S, me);
    let buttons;
    if (myTurn) {
      const ok = o.canBid && LiarsGame.bidBeats(S.bid, bid.q, bid.f) && bid.q <= o.maxQ;
      buttons = `${o.canBid ? `<div class="chip bidpick"><div class="row"><span class="label">Quantity</span>
          <button class="btn ghost small" id="qDown" aria-label="Fewer">−</button><b class="big">${bid.q}</b><button class="btn ghost small" id="qUp" aria-label="More">+</button></div>
        <div class="row"><span class="label">Face</span>${[2, 3, 4, 5, 6].map(f => `<button class="btn ghost small facebtn ${bid.f === f ? 'on' : ''}" data-face="${f}" aria-pressed="${bid.f === f}">${DIE_CH[f]}</button>`).join('')}</div></div>` : ''}
        <div class="row">${o.canBid ? `<button class="btn" id="aBid" ${ok ? '' : 'disabled'}>Bid ${bid.q} × ${bid.f}<kbd>↵</kbd></button>` : ''}
        ${o.canLiar ? `<button class="btn red" id="aLiar">LIAR!<kbd>L</kbd></button>` : ''}</div>
        <div class="risk">${bidLine} · ${pullOdds(me)}</div>`;
    } else buttons = `<div class="risk">${!me.alive ? "You're out. Stick around and watch." : S.gun ? '' : `${bidLine}. Waiting for the others...`}</div>`;
    controls = `<div class="chip mine">${me.dice.length ? `<div class="row">${me.dice.map(v => die2d(v)).join('')}</div>` : ''}
      <div><div class="label">${esc(me.name)} · trigger pulls</div>${pullsHTML(me.shots)}</div></div>${buttons}`;
  }
  return {label, controls, results, extra: ''};
}

// Liar's Deck card selection and the Liar's Dice bid being composed; reset at each new turn.
let pick = [], bid = {q: 1, f: 2}, turnKey = '';
function syncTurnUI(S, myTurn){
  const key = myTurn ? `${S.gameId}-${S.round}-${S.mode === 'deck' ? (S.last ? S.last.pid + ':' + S.pile.length : '-') : JSON.stringify(S.bid)}` : '';
  if (key === turnKey) return;
  turnKey = key; pick = [];
  if (myTurn && S.mode === 'dice') bid = {...LiarsGame.diceOptions(S, S.players[viewer]).min};
  if (scene3d) scene3d.setPicked([]);
}
function togglePick(id){
  const S = curState(), me = S && S.players[viewer];
  if (!me || !me.hand.some(c => c.id === id)) return;
  if (pick.includes(id)) pick = pick.filter(x => x !== id);
  else if (pick.length < LiarsGame.MAX_PLAY) pick = pick.concat(id);
  if (scene3d) scene3d.setPicked(pick);
  render();
}
function playPicked(){
  const S = curState(), me = S.players[viewer];
  const idx = pick.map(id => me.hand.findIndex(c => c.id === id)).filter(k => k >= 0);
  if (!idx.length) return;
  pick = []; if (scene3d) scene3d.setPicked([]);
  ctl.act({type: 'play', cards: idx});
}
function stepBid(dq, f){
  const S = curState(), o = LiarsGame.diceOptions(S, S.players[viewer]);
  if (f) bid.f = f;
  bid.q = Math.max(1, Math.min(o.maxQ, bid.q + (dq || 0)));
  render();
}

/* ---------- HUD ---------- */
const MODE_INFO = {
  poker: {name: 'Bullet Poker', blurb: "Texas Hold'em where you bet bullets."},
  deck: {name: "Liar's Deck", blurb: 'Play cards face down, claim they match. Call the liar.'},
  dice: {name: "Liar's Dice", blurb: 'Bid on everyone\'s hidden dice. Call the liar.'},
};
function render(){
  const S = curState();
  if (!S || !session.inGame) return;
  if (scene3d) scene3d.update(S, viewer, false);
  const me = viewer != null ? S.players[viewer] : null;
  const myTurn = S.awaiting != null && S.awaiting === viewer && !S.gun;
  const mode = S.mode || 'poker';
  if (mode !== 'poker') syncTurnUI(S, myTurn);

  let center = '';
  if (S.gun) {
    const p = S.players[S.gun.pid];
    center = S.gun.state === 'load' || S.gun.state === 'aim' ? cylinderHTML(S.gun, p)
      : S.gun.state === 'bang' ? `<div class="shot dead">BANG!</div>`
      : S.gun.state === 'godsave' ? `<div class="godsave"><div class="shot god">GOD SAVE!</div><div class="label">${esc(p.name)} survived six bullets · 5% chance</div></div>` : `<div class="shot live">Click.</div>`;
  }
  audio.setIntensity(musicIntensity(S));
  const H = mode === 'deck' ? deckHUD(S, me, myTurn) : mode === 'dice' ? diceHUD(S, me, myTurn) : pokerHUD(S, me, myTurn);

  $hud.innerHTML = `
  <div class="hud top">
    <div class="chip"><div class="brand">${MODE_INFO[mode].name}</div><div class="label">${H.label}</div></div>
    <div class="row">
      <button class="btn ghost small ${audio.music ? 'on' : ''}" id="tMusic" title="Switch track">♪ ${audio.musicLabel}</button>
      <button class="btn ghost small ${volOpen ? 'on' : ''}" id="tVol" aria-expanded="${volOpen}" aria-controls="volpanel">Volume</button>
      ${mode === 'poker' ? `<button class="btn ghost small ${boardOpen ? 'on' : ''}" id="tBoard" aria-pressed="${boardOpen}">Board<kbd>B</kbd></button>` : ''}
      <button class="btn ghost small ${logOpen ? 'on' : ''}" id="tLog">Log</button>
      <button class="btn ghost small" id="quit">Leave</button>
    </div>
  </div>
  <div class="hud" style="top:30%;justify-content:center;pointer-events:none">${center}</div>
  ${H.results}
  ${logOpen ? `<div class="hud" style="top:96px;justify-content:flex-start"><div class="chip log">${S.log.slice(0, 30).map(l => `<div>${esc(l)}</div>`).join('')}</div></div>` : ''}
  <div class="hud bottom"><div class="controls">${H.extra}${H.controls}</div></div>`;

  if (S.over) {
    const host = session.mode === 'host';
    $ov.innerHTML = `<div class="overlay dim"><div class="panel" style="text-align:center;justify-items:center;width:min(460px,100%)">
      <div class="label">Last one standing · after ${mode === 'poker' ? plural(S.handNo, 'hand') : plural(S.round, 'round')}</div>
      <h1>${S.winner != null ? esc(S.players[S.winner].name.replace(' (left)', '')) : 'Nobody'}</h1>
      ${host ? `<div class="row"><button class="btn" id="again" ${session.net.playerCount >= 2 ? '' : 'disabled title="Everyone else left the table"'}>Play again</button><button class="btn ghost" id="toRoom">Back to the room</button></div>`
             : `<p class="sub">Waiting for the host to start another round...</p><button class="btn ghost" id="quit2">Leave</button>`}</div></div>`;
  } else $ov.innerHTML = '';

  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = () => { audio.play('ui'); fn(); }; };
  on('aFold', () => ctl.act({type:'fold'}));
  on('aCoward', () => ctl.act({type:'coward'}));
  on('aCall', () => ctl.act({type:'call'}));
  on('aRaise', () => ctl.act({type:'raise'}));
  on('aAll', () => ctl.act({type:'allin'}));
  on('aSwitch', openSwitch);
  on('swCancel', () => { ctl.switchPick(null, null); sw = null; render(); });
  on('aPlay', playPicked);
  on('aLiar', () => ctl.act({type: 'liar'}));
  on('aBid', () => ctl.act({type: 'bid', q: bid.q, f: bid.f}));
  on('qUp', () => stepBid(1)); on('qDown', () => stepBid(-1));
  on('again', () => { if (session.net.playerCount < 2) return; session.game.stop(); startHostedGame(); });
  on('toRoom', () => { session.game.stop(); session.game = null; session.inGame = false; resetTable(); session.net.backToRoom(); renderRoom(); });
  on('quit', leaveSession); on('quit2', leaveSession);
  on('tLog', () => { logOpen = !logOpen; render(); });
  on('tBoard', toggleBoard);
  on('tMusic', () => { audio.unlock(); audio.cycleMusic(); render(); });
  on('tVol', () => { audio.unlock(); toggleVolume(); });
  $hud.querySelectorAll('[data-card]').forEach(el => el.onclick = () => { audio.play('ui'); togglePick(+el.dataset.card); });
  $hud.querySelectorAll('[data-face]').forEach(el => el.onclick = () => { audio.play('ui'); stepBid(0, +el.dataset.face); });
  $hud.querySelectorAll('[data-offer]').forEach(el => el.onclick = () => { sw.pick = +el.dataset.offer; audio.play('ui'); render(); });
  $hud.querySelectorAll('[data-hole]').forEach(el => el.onclick = () => {
    if (sw.pick == null) return;
    ctl.switchPick(+el.dataset.hole, sw.pick); sw = null; render();
  });
}
function openSwitch(){ sw = {pick: null}; ctl.switchOpen(); render(); }
function toggleBoard(){ boardOpen = !boardOpen; if (scene3d) scene3d.setBoardView(boardOpen); render(); }

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && volOpen) { toggleVolume(false); document.getElementById('tVol')?.focus(); return; }
  const tg = e.target;
  const S = curState();
  if (!S || !session.inGame || (tg && tg.matches && tg.matches('input,select,textarea')) || e.metaKey || e.ctrlKey) return;
  const k = e.key.toLowerCase();
  if (k === 'm') { audio.unlock(); audio.cycleMusic(); return render(); }
  if (S.mode === 'deck' || S.mode === 'dice') {
    if (!(S.awaiting === viewer && !S.gun)) return;
    const me = S.players[viewer];
    if (k === 'l' && document.getElementById('aLiar')) { audio.play('ui'); return ctl.act({type: 'liar'}); }
    if (S.mode === 'deck') {
      if (/^[1-5]$/.test(k) && me.hand[+k - 1]) return togglePick(me.hand[+k - 1].id);
      if (k === 'enter' && pick.length) { audio.play('ui'); return playPicked(); }
    } else {
      if (k === 'arrowup' || k === '+' || k === '=') { e.preventDefault(); return stepBid(1); }
      if (k === 'arrowdown' || k === '-') { e.preventDefault(); return stepBid(-1); }
      if (/^[2-6]$/.test(k)) return stepBid(0, +k);
      const b = document.getElementById('aBid');
      if (k === 'enter' && b && !b.disabled) { audio.play('ui'); return ctl.act({type: 'bid', q: bid.q, f: bid.f}); }
    }
    return;
  }
  if (k === 'b') return toggleBoard();
  if (!(S.awaiting === viewer && !S.gun && !sw)) return;
  const o = PokerGame.optionsFor(S, S.players[viewer]);
  const map = {f: {type:'fold'}, c: {type:'call'}, r: o.canRaise && {type:'raise'}, a: o.canAllIn && {type:'allin'}};
  if (k === 's' && o.canSwitch) return openSwitch();
  if (map[k]) { audio.play('ui'); ctl.act(map[k]); }
});
window.addEventListener('beforeunload', () => { if (session && session.mode === 'host') session.net.close(); });

window.__bp = {get session() { return session; }}; // debug hook for automated tests
const hashCode = NET.cleanCode(location.hash.slice(1));
if (hashCode) joinCode = hashCode;
if (hashCode && profile.name.trim()) { showLobby(); joinTable(hashCode); }
else { if (hashCode) notice = `Pick a name and character, then press Join to sit at table ${hashCode}.`; showLobby(); }
})();
</script>
